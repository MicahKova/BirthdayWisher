
name: Run Scheduled Python Script

on:
  schedule:
    # Run time
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to also trigger this manually via the GitHub UI

jobs:
  run-python-task:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Downloads repository code into the runner
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Step 2: Installs Python on the cloud runner
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8' # Changes to preferred version
          cache: 'pip' # Speeds up future runs by caching dependencies

      # Step 3: Installs project packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Executes script
      - name: Execute Python Script
        run: python main.py
